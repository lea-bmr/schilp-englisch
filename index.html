<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5fa">
<title>Englisch an der Elly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: App-Shell. Desktop: Kopfleiste mit Navigation. Handy: App-Bar oben, Tab-Leiste unten, Listenansichten, Details aufklappbar. */
:root {
  --ink: #142037; --paper: #f2f5fa; --card: #ffffff; --line: #e1e6ef; --muted: #5f6c83;
  --accent: #1d5bd6; --accent-soft: #e7eefc; --on-accent: #ffffff;
  --hv: #1d5bd6; --hv-soft: #e4ecfd; --lv: #0f8a5f; --lv-soft: #e2f4ec; --sp: #d9640b; --sp-soft: #fdeedf; --sc: #8a3ffc; --sc-soft: #f1e9ff; --sm: #0b8a9a; --sm-soft: #dff4f6; --ot: #5f6c83; --ot-soft: #eceff4; --gr: #b3263a; --gr-soft: #fbe6e9;
  --ka: #c42b4b; --ka-soft: #fde7eb; --ok-soft: #e2f4ec;
  --shadow: 0 1px 2px rgba(20, 32, 55, .06), 0 4px 14px rgba(20, 32, 55, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --tabh: 62px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eef8; --paper: #0d1320; --card: #161f31; --line: #26314a; --muted: #9aa8c1;
    --accent: #7aa7ff; --accent-soft: #1c2a48; --on-accent: #0d1320;
    --hv: #7aa7ff; --hv-soft: #1b2946; --lv: #4fd1a1; --lv-soft: #12312a; --sp: #ffa25c; --sp-soft: #392514; --sc: #b993ff; --sc-soft: #2a2145; --sm: #5fd3e0; --sm-soft: #10313a; --ot: #9aa8c1; --ot-soft: #222c40; --gr: #ff8a9b; --gr-soft: #3c1a23;
    --ka: #ff7a93; --ka-soft: #3c1a23; --ok-soft: #12312a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eef8; --paper: #0d1320; --card: #161f31; --line: #26314a; --muted: #9aa8c1;
  --accent: #7aa7ff; --accent-soft: #1c2a48; --on-accent: #0d1320;
  --hv: #7aa7ff; --hv-soft: #1b2946; --lv: #4fd1a1; --lv-soft: #12312a; --sp: #ffa25c; --sp-soft: #392514; --sc: #b993ff; --sc-soft: #2a2145; --sm: #5fd3e0; --sm-soft: #10313a; --ot: #9aa8c1; --ot-soft: #222c40; --gr: #ff8a9b; --gr-soft: #3c1a23;
  --ka: #ff7a93; --ka-soft: #3c1a23; --ok-soft: #12312a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopfleiste */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--gr); color: #fff; font-size: 15px !important; letter-spacing: .02em; display: grid; place-items: center; font: 800 18px var(--display); }
.brand b { font: 800 18px var(--display); white-space: nowrap; }
.back { display: none; border: 0; background: none; padding: 6px; margin-left: -6px; border-radius: 10px; color: var(--accent); align-items: center; gap: 2px; text-decoration: none; font-weight: 600; }
.apptitle { display: none; font: 800 17px var(--display); flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dnav { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.dnav a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 9px; font-weight: 600; font-size: 15px; }
.dnav a:hover { background: var(--accent-soft); }
.dnav a.on { background: var(--accent); color: var(--on-accent); }
.sbtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; display: flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; min-width: 200px; }

main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 70px; }

/* Tab-Leiste (nur Handy) */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tabbar a, .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; cursor: pointer; }
.tabbar .on { color: var(--accent); }

/* Bausteine */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: grid; gap: 12px; }
.sec { margin-top: 24px; display: grid; gap: 10px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sechead a { font-size: 14px; font-weight: 600; text-decoration: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft, var(--accent-soft)); color: var(--c, var(--accent)); text-decoration: none; white-space: nowrap; }
.chip.ka { --soft: var(--ka-soft); --c: var(--ka); }
.chip.free { --soft: var(--line); --c: var(--muted); }
.sk-hv { --c: var(--hv); --soft: var(--hv-soft); } .sk-lv { --c: var(--lv); --soft: var(--lv-soft); } .sk-sg, .sk-zs, .sk-sp { --c: var(--sp); --soft: var(--sp-soft); }
.sk-sc { --c: var(--sc); --soft: var(--sc-soft); } .sk-sm { --c: var(--sm); --soft: var(--sm-soft); } .sk-wo, .sk-au, .sk-ot { --c: var(--ot); --soft: var(--ot-soft); } .gr { --c: var(--gr); --soft: var(--gr-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* Segment-Umschalter Jahrgänge */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.seg::-webkit-scrollbar { display: none; }
.seg a { flex: none; min-width: 52px; text-align: center; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font: 800 16px var(--display); }
.seg a.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Listenzeilen */
.rows { display: grid; overflow: hidden; }
.row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px 12px 0; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); min-height: 64px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
.row .bar { align-self: stretch; background: var(--c); border-radius: 0 4px 4px 0; }
.row .t { font-weight: 700; line-height: 1.25; }
.row .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
.row .r { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.row.dash .bar { background: repeating-linear-gradient(var(--c) 0 6px, transparent 6px 10px); }

/* Jahresstreifen */
.strip { display: flex; gap: 3px; height: 34px; border-radius: 10px; overflow: hidden; }
.strip a { background: var(--soft); border-top: 4px solid var(--c); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--c); text-decoration: none; min-width: 0; }
.strip a.dash { opacity: .75; }
.stripleg { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }

/* Startseite */
.hello { display: grid; gap: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { text-decoration: none; color: var(--ink); padding: 14px; display: grid; gap: 4px; position: relative; overflow: hidden; }
.tile .n { font: 800 40px/1 var(--display); color: var(--accent); }
.tile .s { font-size: 13px; color: var(--muted); }
.tile .mini { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 4px; overflow: hidden; }
.tile .mini span { background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { padding: 12px 14px; }
.stat b { display: block; font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

/* Themenseite */
.thead { display: grid; gap: 10px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.facts b { display: block; font: 800 20px/1.1 var(--display); }
.facts span { font-size: 12px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { counter-increment: s; content: counter(s); font: 800 13px var(--display); color: var(--accent); background: var(--accent-soft); border-radius: 8px; text-align: center; padding: 2px 0; }
.steps li.note { grid-template-columns: 28px 1fr; color: var(--muted); font-style: italic; font-size: 14px; }
.steps li.note::before { content: "i"; counter-increment: none; background: var(--line); color: var(--muted); font-style: normal; }
.steps .pg { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flow h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.flow ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.flow a.chip { margin-right: 4px; }
.kacard { padding: 14px 16px; display: grid; gap: 4px; border-left: 5px solid var(--ka); }
.kacard.no { border-left-color: var(--line); }
.kacard b { color: var(--ka); }
.kacard.no b { color: var(--muted); }

/* Aufklappbereiche */
.acc { display: grid; gap: 10px; }
details.card > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 700; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft, var(--accent-soft)); color: var(--c, var(--accent)); flex: none; }
details.card > summary .lbl { flex: 1; }
details.card > summary .lbl small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
details.card > summary .chev { transition: transform .2s; color: var(--muted); }
details.card[open] > summary .chev { transform: rotate(90deg); }
details.card .body { padding: 0 16px 16px; display: grid; gap: 10px; font-size: 15px; }
.body ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.kl { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.kl .lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.task { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.task p { margin: 0; }
.task button { justify-self: start; border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
.task .sol { display: none; padding: 9px 11px; border-radius: 10px; background: var(--ok-soft); }
.task.open .sol { display: block; }
.prozess { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.prozess div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.prozess b { display: block; margin-bottom: 4px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.pager a { text-decoration: none; color: var(--ink); padding: 12px 14px; font-size: 15px; font-weight: 600; line-height: 1.3; }
.pager a small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.pager a.next { text-align: right; grid-column: 2; }

/* Klassenarbeiten */
.kalist { display: grid; }
.karow { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: start; text-decoration: none; color: var(--ink); }
.karow:last-child { border-bottom: 0; }
.karow .nr { font: 800 15px var(--display); color: var(--ka); }
.karow.prep .nr { color: var(--muted); font-size: 13px; }
.karow .th { font-weight: 700; line-height: 1.3; }
.karow .an { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Spirale */
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.thread { padding: 14px; display: grid; gap: 10px; }
.thread .path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.matrix { overflow-x: auto; }
.mx { display: grid; grid-template-columns: 120px repeat(6, minmax(120px, 1fr)); gap: 6px; min-width: 880px; padding: 14px; }
.mx .h { font: 800 14px var(--display); padding: 4px 6px; }
.mx .rh { font-weight: 700; font-size: 14px; padding: 8px; border-radius: 10px; background: var(--soft); color: var(--c); overflow-wrap: anywhere; }
.mx .cx { display: flex; flex-direction: column; gap: 4px; }
.mx .cx a { white-space: normal; border-radius: 8px; font-size: 12px; line-height: 1.25; padding: 4px 7px; }

/* Suche */
.search { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
.search.show { display: flex; }
.search-top { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.search-top input { flex: 1; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.search-top button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 8px; }
.search-res { overflow: auto; padding: 12px 16px 40px; max-width: 760px; width: 100%; margin: 0 auto; }
.search-res .hint { color: var(--muted); font-size: 14px; padding: 8px 2px; }

/* Handy */
@media (max-width: 760px) {
  .dnav, .sbtn, .brand b { display: none; }
  .apptitle { display: block; }
  .back.show { display: inline-flex; }
  .brand.hide { display: none; }
  .tabbar { display: block; }
  main { padding: 16px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px); }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .flow { grid-template-columns: 1fr; }
  .facts b { font-size: 18px; }
  .row { min-height: 60px; }
  h1.big { font-size: 28px; }
  .desk { display: none; }
}
@media (min-width: 761px) { .mob { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Englisch-Ergänzungen */
.skill { border-left: 5px solid var(--c); padding: 12px 14px; display: grid; gap: 6px; }
.skill h3 { color: var(--c); font-size: 15px; }
.skill ul, .plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.gram li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.spiralnote { display: grid; gap: 8px; }
.sp-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.sp-row .nm { font-weight: 700; color: var(--gr); font-size: 14px; }
.sp-row .nav { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; align-items: center; }
.step { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); align-items: baseline; }
.step:last-child { border-bottom: 0; }
.step .u { font: 800 14px var(--display); color: var(--gr); }
.step .t2 { font-size: 13px; color: var(--muted); }
.step.cur { background: var(--gr-soft); }
.thread2 h3 { padding: 14px 14px 4px; color: var(--gr); }
.thread2 .tl { padding: 0 0 4px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); white-space: nowrap; }
.tag.oral { background: var(--sp-soft); color: var(--sp); }
.tag.written { background: var(--ka-soft); color: var(--ka); }
.tag.zp { background: var(--gr-soft); color: var(--gr); }
.klp-sec { display: grid; gap: 8px; }
.klp-item { display: grid; grid-template-columns: 1fr; gap: 3px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.klp-item:last-child { border-bottom: 0; }
.klp-item .ref { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.klp-sub { font-weight: 700; font-style: italic; padding-top: 8px; }
.intro { font-weight: 600; }
.mx2 { display: grid; grid-template-columns: 150px repeat(6, minmax(90px, 1fr)); gap: 6px; min-width: 760px; padding: 14px; }
.mx2 .h { font: 800 14px var(--display); padding: 4px 6px; }
.mx2 .rh { font-weight: 700; font-size: 13px; padding: 8px; border-radius: 10px; background: var(--soft); color: var(--c); }
.mx2 .cx { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.mx2 .cx a { font-size: 12px; padding: 3px 7px; }
.rules li { margin-bottom: 4px; }
table.kt { width: 100%; border-collapse: collapse; font-size: 14px; }
table.kt th, table.kt td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kt th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.pgl { display: grid; grid-template-columns: 150px 1fr; gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.pgl:last-child { border-bottom: 0; }
@media (max-width: 760px) { .pgl { grid-template-columns: 1fr; gap: 2px; } .skills { grid-template-columns: 1fr; } }
.kaparts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 6px 0 2px; }
.kp { border-left: 4px solid var(--c); background: var(--soft); border-radius: 8px; padding: 6px 9px; display: grid; gap: 1px; font-size: 13px; }
.kp b { color: var(--c); font-size: 13px; }
.subtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.subtabs a { padding: 9px 12px; text-decoration: none; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.subtabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.ksec { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.ksec.on { border-color: var(--gr); }
.ksec h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.focus { background: var(--gr-soft); border-radius: 10px; padding: 9px 11px; display: grid; gap: 4px; }

 und Schüler können sich auf einfache vertraute Aussprache- und Intonationsmuster stützen und diese ihren Hör- und Sprechabsichten entsprechend soweit korrekt anwenden, dass sie trotz eines möglichen Akzents verstanden werden.", "items": [["einfache Aussprache- und Intonationsmuster beachten und auf neue Wörter und Sätze übertragen,", "RL 1: u. a. 37/3. 104/7-8, 177/ Aussprachemuster auf den Grammatik-seiten", false], ["die Wörter ihres grundlegenden Wortschatzes aussprechen,", "RL 1: u. a. 37/3. 104/7-8, 230/ Sounds, Lauschrift auf den Wörterbuchseiten", false], ["die Intonation einfacher Aussagesätze, Fragen und Aufforderungen realisieren.", "RL 1: u. a. 16/9, 17/10b, 86/2, 87/4", false]], "konk": ["grundlegende Besonderheiten des Vokalismus und Konsonantismus", "silent letters", "short/long forms", "Wortbetonung"], "krefs": ["RL 1: 39/9 (short/long forms)", "RL 1: u. a. 180 (Wortbetonung)"]}, {"top": "Verfügen über sprachliche Mittel", "head": "Orthografie", "intro": "Die Schülerinnen und Schüler können weitgehend orthografisch korrekt schreiben.", "items": [["typische Laut-Buchstaben-Verbindungen beachten,", "RL 1: u. a. 8, 37/3, 63/3, 125/6", false], ["einfache, grundlegende Regeln der Rechtschreibung und Zeichensetzung anwenden,", "RL 1: u. a. 16/7, 44/7", false], ["die Wörter ihres grundlegenden Wortschatzes weitgehend korrekt schreiben.", "RL 1: u. a. 224-225, 228-229", false]], "konk": ["capitalisation", "silent letters", "short forms", "orthografische Besonderheiten vor Flexionsendungen"], "krefs": ["RL 1: 21/5, 24/ Step 2, 103/3 (capitalisation)", "RL 1: 17/11. 39/9-10 (short/long forms)", "RL 1: u. a. 43/6, 65/5, (Besonderheiten vor Flexionsendungen)"]}, {"top": "Interkulturelle kommunikative Kompetenz", "head": "Interkulturelle kommunikative Kompetenz", "intro": "Die Schülerinnen und Schüler können in einfachen interkulturellen Kommunikationssituationen sowohl in direkten persönlichen Begegnungen als auch im Umgang mit englischsprachigen Texten und Medien weitgehend angemessen handeln. Sie können einfache kulturell geprägte Sachverhalte und Situationen verstehen und einfache kulturelle Konventionen und Unterschiede in ihrem interkulturellen Handeln respektvoll und geschlechtersensibel berücksichtigen.", "items": [["Soziokulturelles Orientierungswissen:", "", true], ["auf ein elementares soziokulturelles Orientierungswissen zu anglophonen Lebenswirklichkeiten in Großbritannien zurückgreifen.", "RL 1: u. a. 53/2, 79/1, 85/3, 96/1, 107/2, 114, 118-119, 140-141", false], ["Interkulturelle Einstellungen und Bewusstheit:", "", true], ["neuen Erfahrungen mit anderen Kulturen offen und lernbereit begegnen,", "RL 1: u. a. 38/6, 102/1, 141/2 RL 1: u.a. 14/2 (school uniforms)", false], ["einfache fremdkulturelle Werte, Normen und Verhaltensweisen mit durch die eigene Kultur geprägten Wahrnehmungen und Einstellungen auch aus Gender-Perspektive vergleichen.", "", false], ["Interkulturelles Verstehen und Handeln:", "", true], ["sich in elementare Denk- und Verhaltensweisen von Menschen der Zielkultur hineinversetzen,", "RL 1: u. a. 20/2, 79/1, 124/2", false], ["in einfachen interkulturellen Kommunikationssituationen elementare kulturspezifische Konventionen und Besonderheiten des Kommunikationsverhaltens respektvoll beachten.", "RL 1: u. a. 16/8, 23/14, 90, 125/2, 127/12", false]], "konk": ["persönliche Lebensgestaltung: Alltag und Freizeitgestaltung von Kindern: Familie, Freunde, Hobbys, Schule, Sport, Reisen, Ernährung, Mediennutzung", "Ausbildung/Schule: Einblick in den Schulalltag in Großbritannien", "Teilhabe am gesellschaftlichen Leben: Lebenswirklichkeiten von Familien und Kindern am Beispiel einer Region in Großbritannien (geografische, soziale und kulturelle Aspekte); zentrale historische und kulturell bedeutsame Personen und Ereignisse, Feste und Traditionen, Mediennutzung im Alltag", "Berufsorientierung: vertraute Berufsbilder, Taschengeld"], "krefs": ["RL 1: u. a. 35/2, 40/Step 3, 112/Step 4, 60/9, 62/Step 2", "RL 1: u. a. 14/1, 19/1, 20/1-2", "RL 1: u. a. 37/4, 52/1, 58/3, 65/5, 79/1, 114, 119/1, 140-141", "RL 1: 64/2-3"]}, {"top": "Text- und Medienkompetenz", "head": "Text- und Medienkompetenz", "intro": "Die Schülerinnen und Schüler erwerben Text- und Medienkompetenz in exemplarischer und kritischer Auseinandersetzung mit einem repräsentativen und geschlechtersensibel ausgewählten Spektrum soziokulturell relevanter Texte. Die Schülerinnen und Schüler können einfache Methoden der Rezeption und Produktion von kurzen, klar strukturierten Texten und Medien, die sich auf vertraute Alltagssituationen beziehen, anwenden. Dabei berücksichtigen sie grundlegende Aspekte der Kommunikationssituation. Analoge und digitale Texte und Medien setzen sie in diesem Zusammenhang weitgehend funktional ein.", "items": [["didaktisierte und einfache authentische Texte und Medien bezogen auf Thema, Inhalt, Aussage untersuchen,", "RL 1: u. a. 103/2, 115/3, 137/3", false], ["eigene und fremde Texte nach Einleitung, Hauptteil und Schluss gliedern,", "RL 1: u. a. 23/14, 105/11, 112/ Step2", false], ["einfache Informationsrecherchen zu einem Thema nach Vorgaben durchführen und die themenrelevanten Informationen finden und strukturieren,", "RL 1: u.a. 85/3, 93/6b", false], ["unter Einsatz einfacher produktionsorientierter Verfahren nach Vorgaben kurze analoge und digitale Texte sowie Medienprodukte erstellen.", "RL 1: u. a. 29, 73, 95, 106/13, 112/13, 117", false]], "konk": ["didaktisierte und kurze, klar strukturierte authentische Texte, Lesetexte, Hör-/Hörseh-texte, mehrfach kodierte Texte Ausgangstexte", "Sach- und Gebrauchstexte: informierende und erklärende Texte; Alltagsgespräche, Sprachnachrichten; Briefe, E-Mails, Postkarten, Tagebucheinträge, Textnachrichten; Bilder, Einladungen, Anzeigen, Plakate, Flyer, Informations-tafeln; Audio- und Videoclips", "literarische Texte: narrative und szenische Texte; lyrische Texte: Songs, Gedichte; Bildergeschichten; Audio- und Videoclips Zieltexte", "Sach- und grundlegenden Wortschatz rezeptiv nutzen.", "items": [["classroom phrases verstehen und situationsangemessen anwenden,", "RL 2: u. a. 267–268/ Instructions, Classroom phrases", false], ["einen einfachen allgemeinen Wortschatz sowie thematischen Wortschatz verstehen und situationsangemessen anwenden,", "RL 2: u. a. 77/3, 121/5, 281/ Word bank", false], ["einen einfachen Wortschatz zur Benennung sprachlicher Elemente sowie zu einfachen Formen der Textbesprechung und Textproduktion verstehen.", "RL 2: u. a. 11/4, 14/ Step 1, 34/8, 273/ Word bank, 272/ Word bank", false]], "konk": [], "krefs": []}, {"top": "Verfügen über sprachliche Mittel", "head": "Grammatik", "intro": "Die Schülerinnen und Schüler können in vertrauten Alltagssituationen ein einfaches grammatisches Grundinventar für die Textrezeption und die Realisierung von Sprech- und Schreibabsichten nutzen, wobei elementare Fehler vorkommen können.", "items": [["Personen, Sachen, Sachverhalte, Tätigkeiten und Geschehnisse bezeichnen und in einfacher Form beschreiben,", "RL 2: u. a. 36/ Step 2, 40/9, 58/ Step 2 & 3", false], ["bejahte und verneinte Aussagen, Fragen und Aufforderungen formulieren,", "RL 2: u. a. 18/7, 19/10, 57/12, 62/8 & 9", false], ["in einfacher Form Erlaubnis, Bitten und Verpflichtungen ausdrücken,", "RL 2: u. a. 13/11, 61/4b, 267–268/ Instructions, Classroom phrases", false], ["in einfacher Form räumliche, zeitliche und logische Bezüge zwischen Sätzen herstellen, Bedingungen ausdrücken,", "RL 2: u. a. 17/5b, 19/10b, 67/5a, 124/ Step 3", false], ["grundlegend über gegenwärtige, vergangene und zukünftige Ereignisse aus dem eigenen Erfahrungsbereich berichten und erzählen,", "RL 2: u. a. 13/11, 15/1b, 43/4, 80/ Step 2 & 3", false], ["Aussagen wörtlich wiedergeben.", "RL 2: u. a. 31/1b, 41/12, 54/1", false]], "konk": ["nouns: singular vs. plural, s-genitive, of-construction", "determiners: articles, pronouns, quantifiers", "comparison of adjectives", "simple present, present progressive, simple pas en Wörterbuchseiten", false], ["die Intonation einfacher Aussagesätze, Fragen und Aufforderungen realisieren.", "RL 2: u. a. 47/ Step 6, 99/6", false]], "konk": ["grundlegende Besonderheiten des Vokalismus und Konsonantismus", "silent letters", "short/long forms", "Wortbetonung"], "krefs": ["RL 2: u. a. 17/6 (Wortbetonung)", "RL 2: u. a. 33/6 (grundlegende Besonderheiten des Vokalismus und Konsonantismus)", "RL 2: u. a. 128/8 (silent letters)"]}, {"top": "Verfügen über sprachliche Mittel", "head": "Orthografie", "intro": "Die Schülerinnen und Schüler können weitgehend orthografisch korrekt schreiben.", "items": [["typische Laut-Buchstaben-Verbindungen beachten,", "RL 2: 33/6", false], ["einfache, grundlegende Regeln der Rechtschreibung und Zeichensetzung anwenden,", "RL 2: u. a. 18/7, 35/ Language detectives", false], ["die Wörter ihres grundlegenden Wortschatzes weitgehend korrekt schreiben.", "RL 2: u. a. 235–236, 240", false]], "konk": ["capitalisation", "silent letters", "short forms", "orthografische Besonderheiten vor Flexionsendungen"], "krefs": ["RL 2: u. a. 128/8 (silent letters)", "RL 2: u. a. 195/2, 79/9 (short forms)", "RL 2: u. a. 56/9 (Besonderheiten vor Flexionsendungen)"]}, {"top": "Interkulturelle kommunikative Kompetenz", "head": "Interkulturelle kommunikative Kompetenz", "intro": "Die Schülerinnen und Schüler können in einfachen interkulturellen Kommunikationssituationen sowohl in direkten persönlichen Begegnungen als auch im Umgang mit englischsprachigen Texten und Medien weitgehend angemessen handeln. Sie können einfache kulturell geprägte Sachverhalte und Situationen verstehen und einfache kulturelle Konventionen und Unterschiede in ihrem interkulturellen Handeln respektvoll und geschlechtersensibel berücksichtigen.", "items": [["Soziokulturelles Orientierungswissen:", "", true], ["auf ein elementares soziokulturelles Orientierungswissen zu anglophonen Lebenswirklichkeiten in Großbritannien zurückgreifen.", "RL 1: u. a. 53/2, 79/1, 85/3, 96/1, 107/2, 114, 118–119, 140–141 RL 2: u. a. 21/3, 26–27, 48– 49, 75/2, 92–93, 114–115", false], ["Interkulturelle Einstellungen und Bewusstheit:", "", true], ["neuen Erfahrungen mit anderen Kulturen offen und lernbereit begegnen,", "RL 2: u. a. 82/1, 16/2 & 3", false], ["einfache fremdkulturelle Werte, Normen und Verhaltensweisen mit durch die eigene Kultur geprägten Wahrnehmungen und Einstellungen auch aus Gender-Perspektive vergleichen.", "RL 2: u. a. 15/4, 97/1, 105/4 (food)", false], ["Interkulturelles Verstehen und Handeln:", "", true], ["sich in elementare Denk- und Verhaltensweisen von Menschen der Zielkultur hineinversetzen,", "RL 2: u. a. 10/3, 76/2, 123/10", false], ["in einfachen interkulturellen Kommunikationssituationen elementare kulturspezifische Konventionen und Besonderheiten des Kommunikationsverhaltens respektvoll beachten.", "RL 2: u. a. 13/10, 20/13, 79/9", false]], "konk": ["persönliche Lebensgestaltung: Alltag und Freizeitgestaltung von Kindern: Familie, Freunde, Hobbys, Schule, Sport, Reisen, Ernährung, Mediennutzung", "Ausbildung/Schule: Einblick in den Schulalltag in Großbritannien", "Teilhabe am gesellschaftlichen Leben: Lebenswirklichkeiten von Familien und Kindern am Beispiel einer Region in Großbritannien (geografische, soziale und kulturelle Aspekte); zentrale historische und kulturell bedeutsame Personen und Ereignisse, Feste und Traditionen, Mediennutzung im Alltag", "Berufsorientierung: vertraute Berufsbilder, Taschengeld"], "krefs": ["RL 2: u. a. 9/2, 19/12, 91/ Step 3, 97/2", "RL 2: u. a. 9/1, 32/2, 38/2, 60/2", "RL 2: u. a. 10/2, 15/2, 21/2, 26–27, 48–49, 53/1, 81/2, 88", "RL 2: u. a. 48–49, 37/2"]}, {"top": "Text- und Medienkompetenz", "head": "Text- und Medienkompetenz", "intro": "Die Schülerinnen und Schüler erwerben Text- und Medienkompetenz in exemplarischer und kritischer Auseinandersetzung mit einem repräsentativen und geschlechtersensibel ausgewählten Spektrum soziokulturell relevanter Texte. Die Schülerinnen und Schüler können einfache Methoden der Rezeption und Produktion von kurzen, klar strukturierten Texten und Medien, die sich auf vertraute Alltagssituationen beziehen, anwenden. Dabei berücksichtigen sie grundlegende Aspekte der Kommunikationssituation. Analoge und digitale Texte und Medien setzen sie in diesem Zusammenhang weitgehend funktional ein.", "items": [["didaktisierte und einfache authentische Texte und Medien bezogen auf Thema, Inhalt, Aussage untersuchen,", "RL 2: u. a. 89/2, 111/3, 67/4", false], ["eigene und fremde Texte nach Einleitung, Hauptteil und Schluss gliedern,", "RL 2: u. a. 67/5a, 13/10b, 13/11b, 225", false], ["einfache Informationsrecherchen zu einem Thema nach Vorgaben durchführen und die themenrelevanten Informationen finden und strukturieren,", "RL 2: u. a. 15/4, 23/4, 58/ Step 2", false], ["unter Einsatz einfacher produktionsorientierter Verfahren nach Vorgaben kurze analoge und digitale Texte sowie Medienprodukte erstellen.", "RL 2: u. a. 25, 108/12, 113, 69", false]], "konk": ["didaktisierte und kurze, klar strukturierte authentische Texte, Lesetexte, Hör-/Hörseh-texte, mehrfach kodierte Texte Ausgangstexte", "Sach- und Gebrauchstexte: informierende und erklärende Texte; Alltagsgespräche, Sprachnachrichten; Briefe, E-Mails, Postkarten, Tagebucheinträge, Textnachrichten; Bilder, Einladungen, Anzeigen, Plakate, Flyer, Informations-tafeln; Audio- und Videoclips", "literarische Texte: narrative und szenische Texte; lyrische Texte: Songs, Gedichte; Bildergeschichten; Audio- und Videoclips Zieltexte", "Sach- und Gebrauchstexte: Alltagsgespräche, Briefe, E-Mails, Postkarten, Tagebucheinträge, Textnachrichten; Einladungen; Plakate, Flyer, Präsentationen", "literarische Texte: narrative Texte"], "krefs": ["Ausgangstexte Sach- und Gebrauchstexte", "RL 2: u. a. 10/2, 32/2, 88, 120/2, 54/2 Literarische Texte", "RL 2: u. a. 44–45, 110, 67/2, 78/8 Zieltexte Sach- und Gebrauchstexte", "RL 2: u. a. 13/11b, 15/4b, 111/5, 130/13 Literarische Texte", "RL 2: u. a. 124/ Step 3, 20/13"]}, {"top": "Sprachlernkompetenz", "head": "Sprachlernkompetenz", "intro": "Die Schülerinnen und Schüler können ihre sprachlichen Kompetenzen in Ansätzen selbstständig erweitern. Dabei nutzen sie ihre Erfahrung mit Mehrsprachigkeit sowie ein einfaches Repertoire von Strategien des individuellen und kooperativen Sprachenlernens.", "items": [["einfache anwendungsorientierte Formen der Wortschatzarbeit einsetzen,", "RL 2: u. a. 21/1, 33/5, 75/1", false], ["Übungs- und Testaufgaben zum systematischen Sprachtraining auch unter Verwendung digitaler Angebote nutzen,", "RL 2: Medien zum Schulbuch, Interaktive Übungen", false], ["einfache Regeln des Sprachgebrauchs mit Hilfe erschließen, verstehen, erprobend anwenden und ihren Gebrauch festigen,", "RL 2: u. a. 85/ Language detectives, 38/ Language tip, 184", false], ["einfache Hilfsmittel nutzen und erstellen, um analoge und digitale Texte und Arbeitsprodukte zu verstehen,", "RL 2: u. a. 97/1 Writing skills, 21/3 Listening skills,", false], ["zu erstellen und zu überarbeiten,", "23/1 Reading skills", false], ["den eigenen Lernfortschritt anhand einfacher, auch digitaler Evaluationsinstrumente einschätzen sowie eigene Fehlerschwerpunkte angeleitet bearbeiten.", "RL 2: u. a. 24/ Checklist, Medien zum Schulbuch, Interaktive Übungen", false]], "konk": ["einfache Strategien der Dokumentation und Strukturierung inhaltlicher und sprachlicher Elemente eigener und fremder Texte und Medien", "einfache Wort- und Texterschließungsstrategien sowie Stile der Verarbeitung von Textinformationen (detailliert, selektiv, global)", "einfache Strategien zur Nutzung digitaler Medien zum Sprachenlernen", "einfache Strategien zur Nutzung eines einfachen zweisprachigen Wörterbuchs", "einfache Strategien zur Nutzung lexikalischer, grammatischer und methodischer Teile eines Lehrwerks", "einfache Strategien zum produktiven Umgang mit einfachen Feedback- und Selbstevaluationsinstrumenten"], "krefs": ["RL 2: u. a. 25, 36/13, 47", "RL 2: u. a. 58/ Writing skills, 80/ Speaking skills, 97/1 Writing skills", "RL 2: Interaktive Übungen", "RL 2: u. a. 283–307/ Dictionary", "RL 2: u. a. 12/ Language revision, 283–307/ Dictionary", "RL 2: u. a. 20/ Step 3, 42/ Skills, 91/ Step 7, Interaktive Übungen"]}, {"top": "Sprachbewusstheit", "head": "Sprachbewusstheit", "intro": "Die Schülerinnen und Schüler können elementare Einsichten in die Struktur und den Gebrauch der englischen Sprache sowie ihre Kenntnisse anderer Sprachen nutzen, um einfache mündliche und schriftliche Kommunikationssituationen zu bewältigen.", "items": [["einfache Regelmäßigkeiten und Normabweichungen in den Bereichen Recht-schreibung, Aussprache,", "RL 2: u. a. 17/ Skills, 35/ Language detectives, 41/", false], ["Intonation und Grammatik erkennen und benennen,", "Language detectives, 63/ Language detectives", false], ["im Vergleich des Englischen mit der deutschen Sprache oder anderen vertrauten Sprachen Ähnlichkeiten und Unterschiede erkennen und benennen,", "RL 2: u. a. 123/ Language detectives, 129/ Language detectives, 35/ Language detectives", false], ["offenkundige Beziehungen zwischen Sprach- und Kulturphänomenen erkennen,", "RL 2: u. a. 16/ Culture, 30/ Culture, 32/ Culture", false], ["ihren Sprachgebrauch an die Erfordernisse einfacher Kommunikationssituationen weitgehend anpassen.", "RL 2: u. a. 77/5, 128/6", false]], "konk": [], "krefs": []}, {"top": "Querschnittsaufgaben", "head": "Querschnittsaufgaben", "intro": "Im Rahmen des allgemeinen Bildungs- und Erziehungsauftrags der Schule unterstützt der Unterricht im Fach Englisch die Entwicklung einer mündigen und sozial verantwortlichen Persönlichkeit und leistet weitere Beiträge zu fachübergreifenden Querschnittsaufgaben in Schule und Unterricht, hierzu zählen u.a.:", "items": [["Menschenrechtsbildung", "Für spätere Bände geplant", false], ["Werteerziehung", "RL 2: u. a. 221 (Skills), 224 (Skills)", false], ["Politische Bildung und Demokratieerziehung", "Für spätere Bände geplant", false], ["Bildung für die digitale Welt und Medienbildung", "RL 2: u. a. 231 (Skills)", false], ["Bildung für nachhaltige Entwicklung", "RL 2: u. a. 59/1–3, 61/4, 64/12", false], ["Geschlechtersensible Bildung", "RL 2: 123/10, 136–137", false], ["Kulturelle und interkulturelle Bildung", "RL 2: u. a. 52, 74, 96, 118, 16/1, 125/4, 104/3 & 4, 59/3, Heterogenität der Lehrwerkskinder", false]], "konk": [], "krefs": []}], "7": [{"top": "Funktionale kommunikative Kompetenzen", "head": "Hörverstehen und Hör-Sehverstehen", "intro": "Die Schülerinnen und Schüler können Äußerungen sowie Hör- bzw. Hörsehtexte verstehen, wenn in leicht verständlichen Aussprachevarianten gesprochen wird.", "items": [["Unterrichtsbeiträgen die wesentlichen Informationen entnehmen,", "RL 3: u. a. 13/11, 35/11, 63/4, 66/ Step 3", false], ["dem Verlauf einfacher Gespräche folgen und ihnen die Hauptpunkte und wichtige Details entnehmen,", "RL 3: u. a. 11/6, 57/2-3, 62/2-3, 84/2-3, 106/1-2", false], ["Hör-/Hörsehtexten Hauptpunkte und wichtige Details entnehmen,", "RL 3: u. a. 61, 67/2, 89/2, 105/2", false], ["wesentliche implizite Gefühle der Sprechenden identifizieren.", "RL 3: u. a. 47/4, 69/1, 91/5", false]], "konk": [], "krefs": []}, {"top": "Funktionale kommunikative Kompetenzen", "head": "Leseverstehen", "intro": "Die Schülerinnen und Schüler können auch komplexere Texte weitgehend verstehen.", "items": [["Arbeitsanweisungen, Anleitungen und Erklärungen für ihren Lern- und Arbeitsprozess nutzen,", "RL 3: u. a. 19/9, 23/2, 31/1, 86/8, 110/ Your turn", false], ["Sach- und Gebrauchstexten sowie literarischen Texten die Gesamtaussage sowie Hauptpunkte und wichtige Details entnehmen.", "RL 3: u. a. 84/3, 101/4, 115/2", false]], "konk": [], "krefs": []}, {"top": "Funktionale kommunikative Kompetenzen", "head": "Sprechen: an Gesprächen teilnehmen", "intro": "Die Schülerinnen und Schüler können einfach strukturierte mündliche Kommunikationssituationen weitgehend situationsangemessen und adressatengerecht bewältigen.", "items": [["am classroom discourse und an Gesprächen in vertrauten privaten und öffentlichen Situationen in der Form des freien Gesprächs aktiv teilnehmen,", "RL 3: u. a. 14/ Step 2, 25, 91/4", false], ["Gespräche eröffnen, fortführen und beenden sowie auch bei sprachlichen Schwierigkeiten weitgehend aufrechterhalten,", "RL 3: u. a. 13/10, 35/11, 65/11, 101/5", false], ["auf Beiträge des Gesprächspartners weitgehend angemessen eingehen und auf elementare Verständnisprobleme reagieren,", "RL 3: u. a. 17/4, 33/5, 79/5", false], ["sich in unterschiedlichen Rollen an einfachen formalisierten Gesprächen beteiligen.", "RL 3: u. a. 35/11, 43/3, 108/7, 110", false]], "konk": [], "krefs": []}, {"top": "Funktionale kommunikative Kompetenzen", "head": "Sprechen: zusammenhängendes Sprechen", "intro": "Die Schülerinnen und Schüler können zu vertrauten Themen weitgehend zusammenhängend, situationsangemessen und adressatengerecht sprechen.", "items": [["Arbeitsergebnisse weitgehend strukturiert vorstellen,", "RL 3: u. a. 9/1, 31/1, 101/6", false], ["Inhalte von Texten und Medien notizengestützt zusammenfassend wiedergeben,", "RL 3: u. a. 15/2, 23/4b, 37/2, 86/6", false], ["auch digital gestützt eine Präsentation strukturiert vortragen und dabei auf Materialien zur Veranschaulichung eingehen,", "RL 3: u. a. 25, 71, 93/ Step 3, 104", false], ["Texte sinnstiftend und darstellerisch-gestaltend vorlesen.", "RL 3: u. a. 49/ Step 5, 88", false]], "konk": [], "krefs": []}, {"top": "Funktionale kommunikative Kompetenzen", "head": "Schreiben", "intro": "Die Schülerinnen und Schüler können einfache zusammenhängende Texte weitgehend intentions- und adressatengerecht verfassen", "items": [["Arbeits-/Lernprozesse schriftlich begleiten und Arbeitsergebnisse detailliert festhalten,", "RL 3: u. a. 23/2, 34/7, 39/7, 59/8", false], ["ein grundlegendes Spektrum von Texten in beschreibender, berichtender und erzählender Absicht verfassen,", "RL 3: u. a. 40/9, 78/3, 91/5a, 102/8", fals "RL 3: u. a. 58, 59/7-8 (Zeichensetzung bei notwendigen Relativsätzen)", "RL 3: 61/2 (Komma und Punkt in Zahlen)"]}, {"top": "Interkulturelle kommunikative Kompetenz", "head": "Interkulturelle kommunikative Kompetenz", "intro": "Die Schülerinnen und Schüler können in interkulturellen Kommunikationssituationen sowohl in direkten persönlichen Begegnungen als auch im Umgang mit englischsprachigen Texten und Medien weitgehend angemessen handeln. Sie können einzelne kulturell geprägte Sachverhalte und Situationen verstehen und weit verbreitete kulturelle Konventionen und Unterschiede in ihrem interkulturellen Handeln respektvoll und geschlechtersensibel berücksichtigen.", "items": [["Soziokulturelles Orientierungswissen:", "", true], ["auf ein grundlegendes soziokulturelles Orientierungswissen zu anglophonen Lebenswirklichkeiten im Vereinigten Königreich und in den USA zurückgreifen.", "RL 3: u. a. 10/2, 44/2, 69/5a, 91/5b", false], ["Interkulturelle Einstellungen und Bewusstheit:", "", true], ["sich der Chancen und Herausforderungen kultureller Vielfalt bewusst sein und neuen Erfahrungen mit anderen Kulturen offen und lernbereit begegnen,", "RL 3: u. a. 44-46, 61, 67, 111", false], ["eigen- und fremdkulturelle Wertvorstellungen, Einstellungen und Lebensstile grundlegend vergleichen und sie – auch kritisch sowie aus Gender-Perspektive – in Frage stellen.", "RL 3: u. a. 11/5, 37/3, 67/3", false], ["Interkulturelles Verstehen und Handeln:", "", true], ["weit verbreitete (inter-)kulturelle Stereotype/Klischees und Vorurteile erkennen und erläutern,", "RL 3: u. a. 8-9, 61/1, 111", false], ["sich in Denk- und Verhaltensweisen von Menschen anderer Kulturen hineinversetzen und dadurch Verständnis für den anderen entwickeln,", "RL 3: u. a. 8-9, 61/1, 111", false], ["in interkulturellen Kommunikationssituationen grundlegende kulturspezifische Konventionen und Besonderheiten des Kommunikationsverhaltens respektvoll beachten sowie einfache sprachlich-kulturell bedingte Missverständnisse erkennen und weitgehend aufklären,", "RL 3: u. a. 22-23, 31/1, 55/1, 89, 111", false], ["sich mit englischsprachigen Kommunikationspartnern über kulturelle Gemeinsamkeiten und Unterschiede tolerantwertschätzend, erforderlichenfalls aber auch kritisch austauschen.", "RL 3: u. a. 10/1-2, 26-27, 67/2, 111", false]], "konk": ["persönliche Lebensgestaltung: Lebenssituation, Alltag und Freizeitgestaltung von Jugendlichen, Wohnen und Zusammenleben in der Familie, Leben in der peer group, Liebe und Freundschaften, Hobbys, Sport, Musik, analoge und digitale Medien", "Ausbildung/Schule: schulisches Lernen im digitalen Zeitalter", "Teilhabe am gesellschaftlichen Leben: Lebenswirklichkeiten im Vereinigten Königreich und in den USA (geografische, wirtschaftlich-technologische, kulturelle, soziale und politische Aspekte); historisch und kulturell wichtige Personen, Ereignisse, Feste und Traditionen, Mediennutzung im Alltag", "Berufsorientierung: Berufsbilder aus verschiedenen Berufsbereichen"], "krefs": ["RL 3: u. a. 15, 37, 56, 108, 111", "RL 3: u. a. 10, 100f.", "RL 3: u. a. 16, 22-23, 44-47, 61, 67, 72-73, 100-101 Lebenswirklichkeiten in den USA werden in Band 4 behandelt.", "RL 3: u. a. 106, 108"]}, {"top": "Text- und Medienkompetenz", "head": "Text- und Medienkompetenz", "intro": "Die Schülerinnen und Schüler erwerben Text- und Medienkompetenz in exemplarischer und kritischer Auseinandersetzung mit einem repräsentativen und geschlechtersensibel ausgewählten Spektrum soziokulturell relevanter Texte. Die Schülerinnen und Schüler können ein erweitertes Spektrum einfacher Methoden der Rezeption und Produktion von klar strukturierten Texten und Medien anwenden. Dabei berücksichtigen sie wesentliche Aspekte der Kommunikationssituation und grundlegende Textsortenmerkmale. Analoge und digitale Medien setzen sie weitgehend funktional ein.", "items": [["unter Einsatz von Texterschließungsverfahren didaktisierte und einfache authentische Texte und Medien bezogen auf Thema, Inhalt, Textaufbau, Aussage und typische Textsortenmerkmale untersuchen,", "RL 3: u. a. 39/4, 57/2-3, 101/3", false], ["eigene und fremde Texte weitgehend funktional gliedern,", "RL 3: u. a. 40/9, 47/4a, 78/3, 108/9, 111/3", false], ["Informationsrecherchen zu einem Thema durchführen und die themenrelevanten Informationen und Daten filtern, strukturieren und aufbereiten,", "RL 3: 20/ Step 2, 23/4a, 60/ Step 3, 69/5a", false], ["in Texten und Medien vermittelte Absichten herausarbeiten,", "RL 3: u. a. 95, 101/3, 105/3", false], ["Arbeitsergebnisse mithilfe von digitalen Werkzeugen unter Berücksichtigung der rechtlichen Rahmenbedingungen adressatengerecht gestalten und präsentieren,", "RL 3: u. a. 25, 49, 71", false], ["unter Einsatz produktionsorientierter Verfahren analoge und kurze digitale Texte und Medienprodukte erstellen,", "RL 3: u. a. 40/9, 42, 71, 78/3", false], ["unter Einsatz produktionsorientierter Verfahren die einfache Wirkung von Texten und Medien erkunden.", "RL 3: u. a. 40/8, 42, 71, 78/3", false]], "konk": ["didaktisierte sowie klar strukturierte authentische Texte, Lesetexte, Hör-/Hörsehtexte, mehrfach kodierte Texte Ausgangstexte", "Sach- und Gebrauchstexte: informierende und erklärende Texte; Erfahrungsberichte, Stellungnahmen, Interviews; (Leser-) Briefe, E-Mails, Zeitschriftenartikel, social media posts; Anzeigen, Prospekte, Diagramme; Audio- und Videoclips", "literarische Texte: narrative und szenische Texte; lyrische Texte: Liedtexte; Cartoons; Audio- und Videoclips Zieltexte", "Sach- und Gebrauchstexte: informierende Texte; Alltagsgespräche, Sprachnachrichten; Interviews, Briefe, E-Mails, social media posts, Erfahrungsberichte, Stellungnahmen; Plakate, digital gestützte Präsentationen", "literarische Texte: narrative und szenische Texte; Audi- und Videoclips"], "krefs": ["Ausgangstexte Sach- und Gebrauchstexte:", "RL 3: u. a. 16/1, 32/1, 78/1, 89, 90, 100/2, 101/6 Literarische Texte:", "RL 3: u. a. 68, 86/8, 140 Zieltexte Sach- und Gebrauchstexte:", "RL 3: u. a. 47/4a, 78/3, 82, 91/5a, 105/3 Literarische Texte:", "RL 3: u. a. 40/9, 49, 88"]}, {"top": "Sprachlernkompetenz", "head": "Sprachlernkompetenz", "intro": "Die Schülerinnen und Schüler können auf der Grundlage ihres bisher erreichten Mehrsprachigkeitsprofils ihre sprachlichen Kompetenzen teilweise selbstständig erweitern. Dabei nutzen sie ein Repertoire grundlegender Strategien des individuellen und kooperativen Sprachenlernens.", "items": [["unterschiedliche anwendungsorientierte Formen der Wortschatzarbeit einsetzen,", "RL 3: u. a. 15/1, 17/3, 33/3, 57/3, 83/1, 105/1", false], ["Übungs- und Testaufgaben zum systematischen Sprachentraining auch unter Verwendung digitaler Angebote weitgehend selbstständig bearbeiten,", "RL 3: Interaktive Übungen, 144f./ Grammar", false], ["durch Erproben sprachlicher Mittel und kommunikativer Strategien die eigene Sprachkompetenz festigen und erweitern,", "RL 3: u. a. 181, 183, 191", false], ["in Texten grammatische Elemente und Strukturen identifizieren und einfache Hypothesen zur Regelbildung aufstellen,", "RL 3: u. a. 41/ Language detectives, 58/ Language detectives", false], ["auch digitale Hilfsmittel nutzen und erstellen, um analoge und digitale Texte und Arbeitsprodukte zu verstehen, zu erstellen und zu überarbeiten sowie das eigene Sprachenlernen zu unterstützen,", "RL 3: u. a. 20/ Step 4, 49/ Step 5, 69/5b, 82/ Step 4, 93/ Step 3", false], ["den eigenen Lernfortschritt auch anhand digitaler Evaluationsinstrumente einschätzen, Anregungen aufnehmen sowie eigene Fehlerschwerpunkte bearbeiten.", "RL 3: u. a. 24/ Checklist", false]], "konk": ["grundlegende Strategien zur Nutzung digitaler Medien zum Sprachenlernen sowie zur Textverarbeitung und Kommunikation", "grundlegende Strategien zur Nutzung zweisprachiger Wörterbücher sowie grammatischer und methodischer Teile eines Lehrwerks", "grundlegende Texterschließungs- und Kompensationsstrategien sowie Stile der Verarbeitung von Textinformationen (detailliert, suchend   <section class="sec"><h2>Klassenarbeit</h2>${parts
    ? `<a class="card kacard" href="#ka-${b.jg}" style="text-decoration:none;color:var(--ink)"><b>KA ${b.kanr}</b><div class="kaparts">${parts.map(([n, c, t]) => `<div class="kp ${c}"><b>${n}</b><span>${esc(t)}</span></div>`).join("")}</div></a>`
    : b.kat === "oral" ? `<a class="card kacard" href="#ka-${b.jg}" style="text-decoration:none;color:var(--ink);border-left-color:var(--sp)"><b style="color:var(--sp)">KA ${b.kanr}: Mündliche Kommunikationsprüfung</b><span class="small">${esc(ORAL[b.id])}</span><span class="muted small">Bewertet: zusammenhängendes Sprechen und an Gesprächen teilnehmen</span></a>`
    : `<div class="card kacard no"><b>Keine Klassenarbeit</b><span class="muted small">Diagnose der Ausgangslage</span></div>`}
    ${(ERSATZ[b.jg] || []).filter(([x]) => x === b.id).map(([, t]) => `<a class="card kacard" href="#ka-${b.jg}-ersatz" style="text-decoration:none;color:var(--ink);border-left-color:var(--sp)"><b style="color:var(--sp)">Optionaler Ersatz: ${esc(t)}</b><span class="muted small">kann die Klassenarbeit dieser Unit ersetzen</span></a>`).join("")}
    <p class="muted small" style="margin:0">Sonstige Leistungen: ${esc(b.solei)}</p></section>
  <section class="sec"><div class="acc">
    ${acc("users", "sk-sp", "Vereinbarungen", "Kompetenzcurriculum, FÜLL", ul([b.kc ? "Kompetenzcurriculum: " + b.kc : "", b.fuell ? "FÜLL: " + b.fuell : "", b.ankn ? "Anknüpfen: " + b.ankn : ""].filter(Boolean)))}
  </div></section>
  <nav class="pager">${prev ? `<a class="card" href="#uv-${prev.id}"><small>← ${uvLabel(prev.id)}</small>${esc(prev.title)}</a>` : ""}${next ? `<a class="card next" href="#uv-${next.id}"><small>${uvLabel(next.id)} →</small>${esc(next.title)}</a>` : ""}</nav>`;
}

function viewGrammar(focus) {
  shell("grammatik", "Grammatik");
  $("#app").innerHTML = `
  <h1 class="desk">Grammatik im Spiralprinzip</h1>
  <p class="muted" style="margin:6px 0 0;max-width:62ch">Jede Struktur wird eingeführt, später wiederholt und erweitert. Antippen öffnet das Unterrichtsvorhaben.</p>
  <section class="sec"><div class="chips">${THREADS.map(([k, n]) => `<a class="chip gr" href="#gr-${k}">${esc(n)}</a>`).join("")}</div></section>
  <section class="sec"><div class="threads">${THREADS.map(([k, n, st]) => `<div class="card thread2" id="gr-${k}"><h3>${esc(n)}</h3><div class="tl">${st.map(([x, t]) => `<a class="step" href="#uv-${x}"><span class="u">${uvLabel(x)}</span><span><div>${esc(t)}</div><div class="t2">Klasse ${byId[x].jg} · ${esc(byId[x].title)}</div></span></a>`).join("")}</div></div>`).join("")}</div></section>`;
  if (focus) { const el = document.getElementById("gr-" + focus); if (el) { setTimeout(() => { el.scrollIntoView({ block: "start" }); window.scrollBy(0, -70); }, 0); el.style.outline = "3px solid var(--gr)"; } }
}

function viewKomp() {
  shell("kompetenzen", "Kompetenzen", ["#start", "Start"]);
  const cell = (k, j) => B.filter((b) => b.jg === j && skillsOf(b).includes(k));
  const ziel = (j) => [...new Set(B.filter((b) => b.jg === j).flatMap((b) => (b.ziel || "").split(/,\s*/)).map((s) => s.trim()).filter((s) => s && s.length < 60))];
  $("#app").innerHTML = `
  <h1 class="desk">Kompetenzen</h1>
  <p class="muted" style="margin:6px 0 0;max-width:62ch">In welchen Units die funktionalen kommunikativen Kompetenzen schwerpunktmäßig gefördert werden. Am Ende der Klasse 6 steht das Niveau A2, am Ende der Klasse 10 B1.</p>
  <section class="sec"><div class="card matrix"><div class="mx2"><div></div>${JGS.map((j) => `<div class="h">Kl. ${j}</div>`).join("")}
    ${Object.entries(SKN).map(([k, n]) => `<div class="rh sk-${k}">${n}</div>${JGS.map((j) => `<div class="cx">${cell(k, j).map((b) => `<a class="chip sk-${k}" href="#uv-${b.id}" title="${esc(b.title)}">${b.id.replace("-", ".")}</a>`).join("") || '<span class="muted small">–</span>'}</div>`).join("")}`).join("")}</div></div></section>
  <section class="sec"><h2>Zieltexte: Was die Klassen schreiben und produzieren</h2>
    <div class="card rows">${JGS.map((j) => `<div class="row sk-sc" style="grid-template-columns:6px 1fr"><span class="bar"></span><span><div class="t">Klasse ${j}</div><div class="m" style="font-size:14px">${esc(ziel(j).join(", "))}</div></span></div>`).join("")}</div></section>
  <section class="sec"><h2>Weitere Kompetenzbereiche</h2><div class="card pad"><ul class="plain">
    <li><b>Interkulturelle kommunikative Kompetenz:</b> Großbritannien (Kl. 5–7), USA (Kl. 8), Kanada, Australien, Südafrika, Indien (Kl. 9), globale Themen (Kl. 10)</li>
    <li><b>Text- und Medienkompetenz:</b> Ausgangs- und Zieltexte in jeder Unit unter „Texte und Medien“</li>
    <li><b>Sprachlernkompetenz und Sprachbewusstheit:</b> integriert, z. B. Wortschatzarbeit, Lesestrategien, Language detectives, Selbsteinschätzung mit Checklisten</li></ul></div></section>`;
}

function viewKLP(jg) {
  lastJg = jg; try { localStorage.setItem("elly-en-jg", jg); } catch (e) {}
  shell("klp", "Lehrwerk & KLP", [`#jg-${jg}`, `Klasse ${jg}`]);
  let body = "";
  if (jg === 10) {
    const units = [["English connects", "Welcome"], ["A diverse nation", "Unit 1"], ["Take a stand!", "Unit 2"], ["Future visions", "Unit 3"]];
    body = units.map(([u, l]) => { const d = KLP["10"][u] || {};
      return acc("book", "gr", `${l}: ${esc(u)}`, "English G Headlight 6", Object.entries(d).filter(([, v]) => v.length).map(([a, v]) => `<div class="pgl"><b>${esc(a)}</b><span>S. ${esc(v.join("; "))}</span></div>`).join("")); }).join("");
  } else {
    const secs = KLP[String(jg)]; let top = null; const groups = [];
    secs.forEach((s) => { if (s.top !== top) { top = s.top; groups.push([top, []]); } groups[groups.length - 1][1].push(s); });
    body = groups.map(([t, ss]) => `<h2 style="margin-top:10px">${esc(t === "Funktionale kommunikative Kompetenzen" ? "Funktionale kommunikative Kompetenz" : t)}</h2>` + ss.map((s) => {
      if (s.head === "Allgemein") return `<p class="muted small" style="margin:0">${esc(s.intro)}</p>`;
      const items = s.items.map(([t2, r, sub]) => sub ? `<div class="klp-sub">${esc(t2)}</div>` : `<div class="klp-item"><span>${esc(t2)}</span>${r ? `<span class="ref">${esc(r)}</span>` : ""}</div>`).join("");
      const konk = s.konk && s.konk.length ? `<div class="kl"><span class="lab">Fachliche Konkretisierungen</span>${ul(s.konk)}${s.krefs.length ? `<div class="ref small" style="color:var(--accent)">${s.krefs.map(esc).join("<br>")}</div>` : ""}</div>` : "";
      const name = s.head === s.top ? s.head : s.head.replace("Hörverstehen und Hör-Sehverstehen", "Hör-/Hörsehverstehen");
      return acc("target", "sk-hv", esc(name), `${s.items.filter((x) => !x[2]).length} Kompetenzerwartungen`, `<p class="intro" style="margin:0">${esc(s.intro)}</p>${s.top !== "Querschnittsaufgaben" ? '<span class="muted small">Sie können …</span>' : ""}<div>${items}</div>${konk}`);
    }).join("")).join("");
  }
  $("#app").innerHTML = `
  <h1 class="desk" style="margin-bottom:14px">Lehrwerk und Kernlehrplan</h1>
  <nav class="seg" aria-label="Jahrgang">${JGS.map((j) => `<a href="#klp-${j}" class="${j === jg ? "on" : ""}">${j}</a>`).join("")}</nav>
  <section class="sec" style="margin-top:16px"><p class="muted small" style="margin:0">${esc(BOOK[jg])}: Seite/Übung bzw. Seite zu den Kompetenzerwartungen. Die Angaben sind Beispiele, nicht abschließend.</p>
    <div class="acc">${body}</div></section>`;
}

function viewBewertung() {
  shell("bewertung", "Bewertung", ["#start", "Start"]);
  const rows = [[5, 6, "bis 1", "–"], [6, 6, "bis 1", "–"], [7, 5, "1", "–"], [8, 5, "1–2", "1 mündlich"], [9, 4, "1–2", "–"], [10, 4, "2", "1 mündlich + ZP 10"]];
  $("#app").innerHTML = `
  <h1 class="desk">Leistungsbewertung</h1>
  <section class="sec"><h2>Klassenarbeiten an der Elly</h2><div class="card pad" style="overflow-x:auto"><table class="kt"><thead><tr><th>Klasse</th><th>Anzahl</th><th>Dauer (Std.)</th><th>Ersatz</th></tr></thead><tbody>
    ${rows.map(([j, n, d, e]) => `<tr><td><a href="#ka-${j}"><b>${j}</b></a></td><td>${n}</td><td>${d}</td><td>${e}</td></tr>`).join("")}</tbody></table>
    <p class="muted small" style="margin:8px 0 0">Im 2. Halbjahr der Klasse 10 wird mindestens eine schriftliche Klassenarbeit geschrieben, die nicht ersetzt werden kann.</p></div></section>
  <section class="sec"><h2>Regeln für Klassenarbeiten</h2><div class="card pad"><ul class="plain rules">
    <li>Mindestens zwei funktionale kommunikative Teilkompetenzen pro Arbeit</li>
    <li>Schreiben ist in der Regel in jeder Klassenarbeit enthalten</li>
    <li>Hör-/Hörsehverstehen, Leseverstehen und Sprachmittlung mindestens einmal pro Schuljahr</li>
    <li>Geschlossene, halboffene und offene Aufgaben; offene Aufgaben nehmen zu und überwiegen am Ende der Sek I</li>
    <li>Sprachliche Leistung zählt mehr als die inhaltliche; der Anteil des Inhalts wächst mit den Jahren</li>
    <li>Bei isoliert geprüftem Lese- und Hörverstehen zählt nur das Verstehen, nicht die Sprachrichtigkeit</li></ul></div></section>
  <section class="sec"><h2>Sonstige Leistungen</h2><div class="card pad"><ul class="plain">
    <li>Mündliche Mitarbeit (classroom discourse, Partner- und Gruppenarbeit)</li><li>Präsentationen, Rollenspiele, Produkte der Lernaufgaben</li>
    <li>Vokabeltests und kurze schriftliche Übungen</li><li>Heftführung und Hausaufgaben</li><li>Beitrag zu kooperativen Arbeitsformen</li></ul></div></section>
  <section class="sec"><h2>Mündliche Kommunikationsprüfung</h2><div class="card pad small">In Klasse 8 (UV 8.3) und Klasse 10 (UV 10.2) ersetzt eine mündliche Prüfung eine Klassenarbeit. Bewertet werden kommunikative Strategie, Präsentations- bzw. Diskurskompetenz, Verfügen über sprachliche Mittel und sprachliche Korrektheit.</div></section>`;
}

// Suche
const idx = B.map((b) => ({ b, text: [b.id, b.title, b.ikk, ...b.S.flatMap((s) => [s[1], ...s[2]]), ...b.gram, ...b.wort, ...b.tasks, KAS[b.id] && KAS[b.id] !== 'oral' ? KAS[b.id].join(' ') : '', b.aus, b.ziel].join(" ").toLowerCase() }));
function openSearch() { $("#search").classList.add("show"); $("#q").value = ""; renderRes(""); setTimeout(() => $("#q").focus(), 30); }
function closeSearch() { $("#search").classList.remove("show"); }
function renderRes(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { $("#res").innerHTML = `<div class="hint">Begriff eingeben, zum Beispiel present perfect, London, Bewerbung oder Mediation.</div><div class="card rows" style="margin-top:8px">${["5-1", "6-4", "8-1", "9-1"].map((x) => rowHtml(byId[x])).join("")}</div>`; return; }
  const gh = THREADS.filter(([, n, st]) => (n + " " + st.map((s) => s[1]).join(" ")).toLowerCase().includes(q));
  const hits = idx.filter((x) => q.split(/\s+/).every((w) => x.text.includes(w)));
  $("#res").innerHTML = (gh.length ? `<div class="hint">Grammatik</div><div class="card rows">${gh.map(([k, n]) => `<a class="row gr" href="#gr-${k}"><span class="bar"></span><span><div class="t">${esc(n)}</div><div class="m">Spiralprinzip</div></span><span class="r">${ic("chev")}</span></a>`).join("")}</div>` : "")
    + (hits.length ? `<div class="hint">${hits.length} Unterrichtsvorhaben</div><div class="card rows">${hits.map(({ b }) => rowHtml(b)).join("")}</div>` : gh.length ? "" : `<div class="hint">Kein Treffer. Versuch es mit einem anderen Begriff.</div>`);
}
$("#q").addEventListener("input", (e) => renderRes(e.target.value));
$("#sclose").onclick = closeSearch; $("#sbtn").onclick = openSearch; $("#msearch").onclick = openSearch;
$("#res").addEventListener("click", (e) => { if (e.target.closest("a")) closeSearch(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSearch(); });

function route() {
  const h = location.hash.slice(1);
  let keep = false;
  if (/^jg-(\d+)$/.test(h)) viewJg(+h.slice(3));
  else if (/^ka-(\d+)$/.test(h)) viewKA(+h.slice(3));
  else if (/^ka-(\d+)-ersatz$/.test(h)) viewKA(+h.split("-")[1], "ersatz");
  else if (/^klp-(\d+)$/.test(h)) viewKLP(+h.slice(4));
  else if (h.startsWith("uv-")) viewUV(h.slice(3));
  else if (h === "grammatik") viewGrammar();
  else if (h.startsWith("gr-")) { viewGrammar(h.slice(3)); keep = true; }
  else if (h === "kompetenzen") viewKomp();
  else if (h === "bewertung") viewBewertung();
  else viewStart();
  if (!keep) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

</script>
</body>
